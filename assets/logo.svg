<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="stormGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cloud shape -->
  <path d="M 50 80 Q 40 70 40 60 Q 40 45 55 40 Q 60 25 80 25 Q 95 25 105 35 Q 120 25 135 30 Q 150 35 150 50 Q 165 50 165 65 Q 165 80 150 85 Z" 
        fill="url(#stormGradient)" 
        opacity="0.9"/>
  
  <!-- Lightning bolt -->
  <path d="M 100 50 L 90 90 L 105 90 L 95 130 L 125 85 L 110 85 L 115 50 Z" 
        fill="#00d4ff" 
        filter="url(#glow)"/>
  
  <!-- Radar rings -->
  <circle cx="100" cy="140" r="15" fill="none" stroke="#4da6ff" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="140" r="25" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="140" r="35" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="140" r="4" fill="#00d4ff" filter="url(#glow)"/>
</svg>
